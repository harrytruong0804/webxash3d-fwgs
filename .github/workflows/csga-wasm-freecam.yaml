# Build engine wasm CO VA cho cong cu dung clip highlight.
#
# Khac hai workflow kia o cho: KHONG day image len ghcr. Ket qua la mot bo file
# .wasm/.js, day len lam artifact cua Actions — may dev keo ve bang
# `gh run download`. Day image 1.5GB roi lai keo ve chi de lay vai file wasm thi
# vua cham vua ton dia tren box.
name: CSGA wasm (freecam)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/wasm-freecam/**'
      - '.github/workflows/csga-wasm-freecam.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Engine bien dich tu nguon bang emscripten.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h / | tail -1

      # --output type=local: lay thang thu muc ket qua ra, khong can chay
      # container nao (may dev la ARM Mac, khong co docker).
      - name: Build
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build \
            --file docker/wasm-freecam/Dockerfile \
            --target artifact \
            --output type=local,dest=./wasm-out \
            .
          ls -la ./wasm-out

      - uses: actions/upload-artifact@v4
        with:
          name: xash-wasm-freecam
          path: ./wasm-out
          retention-days: 14
